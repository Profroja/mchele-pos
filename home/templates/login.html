{% load static %}
{% load pwa %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ArushaMchelePOS - Login</title>
    {% progressive_web_app_meta %}
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        html {
            height: 100%;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .bg-img {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: fill;
            z-index: -1;
        }

        .login-card {
            width: 380px;
            padding: 40px 35px;
            background: rgba(255, 255, 255, 0.92);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        .login-card h2 {
            color: #1f2937;
            text-align: center;
            margin-bottom: 8px;
            font-size: 26px;
            font-weight: 700;
        }

        .login-card p {
            color: #6b7280;
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .field {
            position: relative;
            margin-bottom: 20px;
        }

        .field > i:first-child {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #9ca3af;
            font-size: 16px;
        }

        .field input {
            width: 100%;
            padding: 14px 14px 14px 45px;
            background: #f3f4f6;
            border: 1px solid #d1d5db;
            border-radius: 12px;
            color: #1f2937;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }

        .field.has-toggle input {
            padding-right: 45px;
        }

        .field input::placeholder {
            color: #9ca3af;
        }

        .field input:focus {
            background: #fff;
            border-color: #f59e0b;
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.15);
        }

        .toggle-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #9ca3af;
            font-size: 16px;
            cursor: pointer;
            user-select: none;
        }

        .toggle-password:hover {
            color: #6b7280;
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: #f59e0b;
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-login:hover {
            background: #d97706;
        }

        .error-msg {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #dc2626;
            text-align: center;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        @media (max-width: 480px) {
            .login-card {
                width: 90%;
                padding: 30px 25px;
            }
        }
    </style>
</head>
<body>
    <img src="{% static 'images/ArushaMchele-bg.jpeg' %}" class="bg-img" alt="background">
    <div class="login-card">
        <h2>Arusha Mchele Loft</h2>
        <p>Sign in to your account</p>

        {% if error %}
            <div class="error-msg">{{ error }}</div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="field">
                <i class="fa fa-user"></i>
                <input type="text" name="username" placeholder="Username" required>
            </div>
            <div class="field has-toggle">
                <i class="fa fa-lock"></i>
                <input type="password" name="password" id="password" placeholder="Password" required>
                <i class="fa fa-eye toggle-password" id="togglePassword"></i>
            </div>
            <button type="submit" class="btn-login" id="loginBtn"><i class="fa fa-right-to-bracket"></i> Sign In</button>
        </form>
    </div>
    <script>
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        const loginBtn = document.getElementById('loginBtn');
        const loginForm = document.querySelector('form');

        togglePassword.addEventListener('click', function () {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            this.classList.toggle('fa-eye');
            this.classList.toggle('fa-eye-slash');
        });

        loginForm.addEventListener('submit', function () {
            loginBtn.innerHTML = '<i class="fa fa-spinner fa-spin"></i> Signing in...';
            loginBtn.disabled = true;
        });
    </script>
</body>
</html>
